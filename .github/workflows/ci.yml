name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the same formatting, linting, and type-checking commands documented
  # in docs/development.md, so a PR cannot land without passing them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  # Runs the test suite on every supported Python version and uploads
  # coverage, so a regression or an untested new line shows up on the PR.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Confirm ssh-keygen is installed
        run: command -v ssh-keygen
      - run: pytest --cov=audit_ssh_keys --cov-report=term-missing --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Runs the ownership tests that only exercise real behavior when the
  # process is root (they are skipped everywhere else).
  test-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: sudo -E "$(command -v python)" -m pytest

  # Lints every Markdown file in the repo the same way VS Code's
  # markdownlint extension does, using the checked-in .markdownlint.json.
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
