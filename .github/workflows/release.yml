name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # PyPI trusted publishing (OIDC), for the publish step
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          version=$(python -c "import audit_ssh_keys; print(audit_ssh_keys.__version__)")
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag) does not match audit_ssh_keys.__version__ ($version)"
            exit 1
          fi

      - name: Check changelog has a heading for this version
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME#v}
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$tag]' heading. Add one before tagging a release."
            exit 1
          fi

      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest

      - run: python -m build

      - name: Check that exactly one wheel and one sdist were built
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          sdist_count=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$wheel_count" -ne 1 ] || [ "$sdist_count" -ne 1 ]; then
            echo "Expected exactly one wheel and one sdist in dist/, found $wheel_count wheel(s) and $sdist_count sdist(s)"
            ls -la dist/
            exit 1
          fi

      # Publishing comes before the GitHub release because PyPI never accepts
      # the same version twice, and a GitHub release can be made by hand while
      # an upload cannot. If the release were created first, a re-run would
      # stop at `gh release create` ("already exists") and never reach the
      # upload. Reads dist/, the action's default, which is where
      # `python -m build` wrote the two files checked just above -- nothing
      # else is in dist/ at this point. The standalone script is copied in
      # only after this step, because the action hands everything in dist/
      # to twine, and twine refuses a bare .py file.
      #
      # skip-existing is on because the wheel and the sdist are uploaded as
      # separate files: a failure part way through can leave one of them on
      # PyPI and not the other, and without this a re-run would abort on the
      # one already there instead of uploading the one still missing. Since
      # PyPI is never asked to replace a file, only to accept one it does not
      # have, the flag cannot paper over changed contents -- re-running after a
      # fully successful upload simply uploads nothing and the job then fails
      # at `gh release create` instead.
      #
      # No API token is stored anywhere: the project is registered on pypi.org
      # as a trusted publisher naming this repository and this workflow file,
      # so the job's OIDC token is what proves who it is. That registration
      # names no environment, so this job must not declare one -- PyPI rejects
      # the token if the two disagree.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

      # This is the same file as src/audit_ssh_keys/audit.py, published under
      # the name of the command instead of the module. The hyphen is
      # deliberate: a file named audit_ssh_keys.py sitting in someone's
      # working directory would shadow the installed package for anything
      # that imports it there, while a name containing a hyphen cannot be
      # reached by an `import` statement.
      - name: Copy audit.py to dist/ as the standalone script
        run: cp src/audit_ssh_keys/audit.py dist/audit-ssh-keys.py

      - name: Check the standalone script is in dist/, is the module, and reports this version
        run: |
          set -euo pipefail
          if [ ! -s dist/audit-ssh-keys.py ]; then
            echo "dist/audit-ssh-keys.py is missing or empty"
            ls -la dist/
            exit 1
          fi
          if ! cmp -s src/audit_ssh_keys/audit.py dist/audit-ssh-keys.py; then
            echo "dist/audit-ssh-keys.py is not byte-identical to src/audit_ssh_keys/audit.py"
            exit 1
          fi
          # -S leaves site-packages out of sys.path, so the copy cannot
          # borrow its version from the package installed earlier in this
          # job -- the version has to come from the literal in the file
          # itself. Stdin is closed per AGENTS.md: every external command
          # this project runs gets stdin closed.
          tag=${GITHUB_REF_NAME#v}
          version_output=$(python -S dist/audit-ssh-keys.py --version </dev/null)
          expected="audit-ssh-keys $tag"
          if [ "$version_output" != "$expected" ]; then
            echo "dist/audit-ssh-keys.py --version printed '$version_output', expected '$expected'"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME#v}
          prerelease_flag=()
          if [[ "$tag" =~ [a-zA-Z] ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --title "$tag" --generate-notes "${prerelease_flag[@]}" dist/*
